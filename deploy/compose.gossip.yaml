# TORCH gossip cluster: one container per node, all from one image.
# CPU only; jobs are simulated. Published ports bind to 127.0.0.1 only.
#
#   docker compose -f deploy/compose.gossip.yaml up --build -d
#   python -m deploy.demo --cluster deploy/gossip.json
#   docker compose -f deploy/compose.gossip.yaml down
#
# TORCH_EXECUTION_SCALE (default 0.1) multiplies job runtimes.
# The first node's service builds the image; `up --build` builds it before
# starting any container. Nodes start together; gossip tolerates peers that
# are not up yet (those early pushes fail and the next round retries).
services:
  l40-1:
    image: torchsched:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    command: ["--cluster", "deploy/gossip.json", "--node", "l40-1", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8201:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15

  l40-2:
    image: torchsched:local
    pull_policy: never
    init: true
    command: ["--cluster", "deploy/gossip.json", "--node", "l40-2", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8202:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15

  a100-1:
    image: torchsched:local
    pull_policy: never
    init: true
    command: ["--cluster", "deploy/gossip.json", "--node", "a100-1", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8203:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15

  mixed-1:
    image: torchsched:local
    pull_policy: never
    init: true
    command: ["--cluster", "deploy/gossip.json", "--node", "mixed-1", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8204:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15
