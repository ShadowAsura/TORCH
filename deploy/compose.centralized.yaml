# TORCH centralized cluster: one container per node, all from one image.
# CPU only; jobs are simulated. Published ports bind to 127.0.0.1 only.
#
#   docker compose -f deploy/compose.centralized.yaml up --build -d
#   python -m deploy.demo --cluster deploy/centralized.json
#   docker compose -f deploy/compose.centralized.yaml down
#
# TORCH_EXECUTION_SCALE (default 0.1) multiplies job runtimes.
# Workers report their status when they start, so they wait for the coordinator.
services:
  coordinator:
    image: torchsched:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    command: ["--cluster", "deploy/centralized.json", "--node", "coordinator", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15

  worker-l40:
    image: torchsched:local
    pull_policy: never
    init: true
    command: ["--cluster", "deploy/centralized.json", "--node", "worker-l40", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8101:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15
    depends_on:
      coordinator:
        condition: service_healthy

  worker-a100:
    image: torchsched:local
    pull_policy: never
    init: true
    command: ["--cluster", "deploy/centralized.json", "--node", "worker-a100", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8102:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15
    depends_on:
      coordinator:
        condition: service_healthy

  worker-mixed:
    image: torchsched:local
    pull_policy: never
    init: true
    command: ["--cluster", "deploy/centralized.json", "--node", "worker-mixed", "--execution-scale", "${TORCH_EXECUTION_SCALE:-0.1}"]
    ports:
      - "127.0.0.1:8103:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15
    depends_on:
      coordinator:
        condition: service_healthy
