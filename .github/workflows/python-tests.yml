name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.17.6
      - name: Lint
        run: python -m ruff check torch_net tests demo.py
      - name: Check simulator for fatal lint errors
        run: python -m ruff check --select E9,F63,F7,F82 simulator.py distributed.py experiment.py test_scheduling.py
      - name: Check formatting
        run: python -m ruff format --check torch_net tests demo.py
