name: Docker smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install demo client
        run: python -m pip install httpx==0.28.1
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 180
      - name: Submit and complete jobs over HTTP
        run: python demo.py --json
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
