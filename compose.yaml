# CPU-only, simulated GPU capacity. No NVIDIA runtime or physical GPU is needed.
# All four APIs run the same Docker image, selected by APP_MODULE.
services:
  scheduler:
    build:
      context: .
    image: torch-network:local
    init: true
    environment:
      APP_MODULE: torch_net.scheduler_app:app
      SCHEDULER_WORKERS: "worker-l40=http://worker-l40:8000,worker-a100=http://worker-a100:8000,worker-t4=http://worker-t4:8000"
      SCHEDULER_POLICY: "${TORCH_POLICY:-centralized}"
      SCHEDULER_SAMPLE_SIZE: "${TORCH_SAMPLE_SIZE:-2}"
      SCHEDULER_SEED: "${TORCH_SEED:-42}"
    ports:
      - "127.0.0.1:${TORCH_SCHEDULER_PORT:-8000}:8000"
  worker-l40:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: torch-worker:local
    init: true
    environment:
      APP_MODULE: torch_net.worker_app:app
      WORKER_ID: worker-l40
      GPU_TYPE: L40
      GPU_COUNT: "${TORCH_L40_GPU_COUNT:-2}"
      GPU_VRAM_GB: "${TORCH_L40_GPU_VRAM_GB:-48}"
      GPU_PERFORMANCE: "${TORCH_L40_PERFORMANCE:-1.0}"
      SIM_SECONDS_PER_WORK_UNIT: "${TORCH_SIM_SECONDS_PER_WORK_UNIT:-0.12}"
    ports:
      - "127.0.0.1:${TORCH_L40_PORT:-8001}:8000"
  worker-a100:
    image: torch-worker:local
    pull_policy: never
    init: true
    environment:
      APP_MODULE: torch_net.worker_app:app
      WORKER_ID: worker-a100
      GPU_TYPE: A100
      GPU_COUNT: "${TORCH_A100_GPU_COUNT:-4}"
      GPU_VRAM_GB: "${TORCH_A100_GPU_VRAM_GB:-80}"
      GPU_PERFORMANCE: "${TORCH_A100_PERFORMANCE:-2.0}"
      SIM_SECONDS_PER_WORK_UNIT: "${TORCH_SIM_SECONDS_PER_WORK_UNIT:-0.12}"
    ports:
      - "127.0.0.1:${TORCH_A100_PORT:-8002}:8000"
  worker-t4:
    image: torch-worker:local
    pull_policy: never
    init: true
    environment:
      APP_MODULE: torch_net.worker_app:app
      WORKER_ID: worker-t4
      GPU_TYPE: T4
      GPU_COUNT: "${TORCH_T4_GPU_COUNT:-2}"
      GPU_VRAM_GB: "${TORCH_T4_GPU_VRAM_GB:-16}"
      GPU_PERFORMANCE: "${TORCH_T4_PERFORMANCE:-0.5}"
      SIM_SECONDS_PER_WORK_UNIT: "${TORCH_SIM_SECONDS_PER_WORK_UNIT:-0.12}"
    ports:
      - "127.0.0.1:${TORCH_T4_PORT:-8003}:8000"
